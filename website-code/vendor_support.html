<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedMe | Customer Support</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .form-card {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 12px;
      max-width: 500px;
      margin: 20px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input, textarea, button {
      width: 100%;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #24422f;
      color: white;
      cursor: pointer;
      margin-top: 12px;
    }
    .ticket-list {
      margin-top: 16px;
    }
    .ticket-item {
      border-bottom: 1px solid #ddd;
      padding: 8px 0;
    }
    .ticket-item span {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <p class="eyebrow">Customer Support</p>
      <h1>Submit a Support Ticket</h1>
      <p class="hero-copy">Having issues with your order or a restaurant? Submit a ticket and track its status here.</p>
    </section>

    <section class="list-panel">
      <div class="form-card">
        <form id="ticketForm">
          <label for="customerName">Your Name:</label>
          <input type="text" id="customerName" placeholder="John Doe" required>

          <label for="orderRef">Order Reference (optional):</label>
          <input type="text" id="orderRef" placeholder="ORD-XYZ123">

          <label for="issueType">Issue Type:</label>
          <input type="text" id="issueType" placeholder="e.g., Late Delivery, Wrong Item" required>

          <label for="issueDetails">Details:</label>
          <textarea id="issueDetails" placeholder="Describe your issue" rows="4" required></textarea>

          <button type="submit">Submit Ticket</button>
        </form>

        <h2>Your Submitted Tickets</h2>
        <div id="ticketList" class="ticket-list"></div>
      </div>
    </section>
  </main>

  <script src="features/vendor-support.js"></script>
</body>
</html>
