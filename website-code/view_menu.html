<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedMe | View Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <section class="menu-topbar">
            <button id="backButton" class="menu-back-button" type="button" aria-label="Go back to previous page">← Back</button>
        </section>

        <section id="restaurantProfile" class="restaurant-profile" aria-live="polite"></section>

        <section class="hero">
            <p class="eyebrow">Restaurant Menu</p>
            <h1>Current Menu</h1>
            <p class="hero-copy">All items currently available for customers.</p>
        </section>

        <section class="list-panel">
            <div id="categoryTabs" class="menu-category-tabs" aria-label="Menu categories"></div>
            <div id="menuContainer" class="menu-category-sections">
                <!-- Menu items will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <script src="features/view-menu.js"></script>
    <script src="features/cart-overlay.js"></script>
</body>
</html>
