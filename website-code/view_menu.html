<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedMe | View Menu</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Minimal inline styles; main styles from style.css */
        .menu-card {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button.remove-btn {
            background-color: #c33;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <section class="hero">
            <p class="eyebrow">Restaurant Menu</p>
            <h1>Current Menu</h1>
            <p class="hero-copy">All items currently available for customers.</p>
        </section>

        <section class="list-panel">
            <div id="menuContainer">
                <!-- Menu items will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <script src="view-menu.js"></script>
</body>
</html>
