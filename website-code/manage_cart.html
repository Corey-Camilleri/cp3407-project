<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedMe | Manage Cart</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .form-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            max-width: 600px;
            margin: 20px auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        input, button {
            width: 100%;
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #24422f;
            color: white;
            cursor: pointer;
            margin-top: 12px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .qty-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            background: #24422f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .remove-btn {
            background: #c33;
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        #emptyCartMessage {
            text-align: center;
            color: #777;
            margin: 10px 0;
        }

        .total {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<main class="page-shell">

    <section class="hero">
        <p class="eyebrow">Manage Cart</p>
        <h1>Your Shopping Cart</h1>
        <p class="hero-copy">Add items, update quantities, or remove items.</p>
    </section>

    <section class="list-panel">

        <div class="form-card">

            <form id="cartForm">
                <input type="text" id="itemName" placeholder="Item name" required>
                <input type="number" id="itemPrice" placeholder="Price" step="0.01" required>
                <input type="number" id="itemQty" value="1" min="1" required>
                <button type="submit">Add Item</button>
            </form>

            <h2>Cart Items</h2>

            <p id="emptyCartMessage">Your cart is empty</p>

            <div id="cartList"></div>

            <div class="total" id="cartTotal">Total: $0.00</div>

            <button id="placeOrderBtn">Place Order</button>

        </div>

    </section>

</main>

<script src="./features/manage-cart.js"></script>

</body>
</html>
