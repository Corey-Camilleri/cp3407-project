<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedMe | Adding Categories to Menu Items</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <header class="topbar">
            <div>
                <p class="brand-mark">FeedMe</p>
                <p class="brand-subtitle">Adding Categories to Menu Items</p>
            </div>
        </header>

        <section class="hero">
            <p class="eyebrow">Menu Management</p>
            <h1>Adding Categories to Menu Items</h1>
            <p class="hero-copy">Assign categories to your menu items to improve organization and searchability.</p>
        </section>

        <section class="list-panel">
            <div class="panel-header">
                <div>
                    <p class="section-label">Category Management</p>
                    <h2>Manage Categories</h2>
                </div>
            </div>

            <div id="categoryList" class="restaurant-grid"></div>
        </section>

        <section class="list-panel">
            <div class="panel-header">
                <div>
                    <p class="section-label">Menu Item Categories</p>
                    <h2>Assign Categories to Menu Items</h2>
                </div>
            </div>

            <div id="menuItems" class="restaurant-grid"></div>
        </section>
    </main>

    <script src="features/add-categories-to-menu-items.js"></script>
</body>

</html>
