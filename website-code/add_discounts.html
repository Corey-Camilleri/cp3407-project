<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedMe | Add Discounts</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            max-width: 400px;
            margin: 20px auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        input,
        button {
            width: 100%;
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #24422f;
            color: white;
            cursor: pointer;
            margin-top: 12px;
        }

        .discount-list {
            margin-top: 16px;
        }

        .discount-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #ddd;
        }

        .discount-item button {
            background: #c33;
            border: none;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main class="page-shell">
        <section class="hero">
            <p class="eyebrow">Manage Discounts</p>
            <h1>Add a Discount</h1>
            <p class="hero-copy">Set percentage discounts for items or entire orders.</p>
        </section>

        <section class="list-panel">
            <div class="form-card">
                <form id="discountForm">
                    <label for="discountName">Discount Name:</label>
                    <input type="text" id="discountName" placeholder="e.g., Summer Sale" required>

                    <label for="discountPercent">Discount (%):</label>
                    <input type="number" id="discountPercent" min="0" max="100" placeholder="e.g., 10" required>

                    <button type="submit">Add Discount</button>
                </form>

                <h2>Current Discounts</h2>
                <div id="discountList" class="discount-list"></div>
            </div>
        </section>
    </main>

    <script src="features/add-discounts.js"></script>
</body>

</html>
