<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedMe | Manage Opening Hours</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            max-width: 500px;
            margin: 20px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        input, button {
            width: 100%;
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #24422f;
            color: white;
            cursor: pointer;
            margin-top: 12px;
        }
        .hours-list {
            margin-top: 16px;
        }
        .hours-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #ddd;
        }
        .hours-item button {
            background: #c33;
            border: none;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <section class="hero">
            <p class="eyebrow">Manage Opening Hours</p>
            <h1>Set Restaurant Hours</h1>
            <p class="hero-copy">Add, edit, or remove opening hours for each day of the week.</p>
        </section>

        <section class="list-panel">
            <div class="form-card">
                <form id="hoursForm">
                    <label for="day">Day:</label>
                    <input type="text" id="day" placeholder="e.g., Monday" required>

                    <label for="openTime">Open Time:</label>
                    <input type="time" id="openTime" required>

                    <label for="closeTime">Close Time:</label>
                    <input type="time" id="closeTime" required>

                    <button type="submit">Add / Update Hours</button>
                </form>

                <h2>Current Hours</h2>
                <div id="hoursList" class="hours-list"></div>
            </div>
        </section>
    </main>

    <script src="manage_opening_hours.js"></script>
    <script src="features/cart-overlay.js"></script>
</body>
</html>
