<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FeedMe | Place Order</title>
	<link rel="stylesheet" href="style.css">
 </head>
<body>
	<main class="page-shell">
		<section class="hero">
			<p class="eyebrow">Checkout</p>
			<h1>Confirm and place your order</h1>
			<p class="hero-copy">Review your items and delivery details, then confirm to send the order to the restaurant.</p>
		</section>

		<section class="list-panel">
			<div class="panel-header">
				<div>
					<p class="section-label">Checkout</p>
					<h2>Order review</h2>
				</div>
			</div>

			<div id="checkoutArea" class="checkout-area">
				<div id="orderItems" class="checkout-item-list"></div>

				<div class="checkout-lower">
					<div class="form-row checkout-form-row">
						<div class="form-column checkout-delivery-column">
							<h3>Delivery details</h3>
							<div id="deliveryDetails">
								<label>
									Name
									<input id="customerName" type="text" placeholder="Full name">
								</label>
								<label>
									Address
									<input id="customerAddress" type="text" placeholder="Street, suburb">
								</label>
								<label>
									Contact phone
									<input id="customerPhone" type="tel" placeholder="Mobile number">
								</label>
							</div>
						</div>

						<div class="checkout-summary-column">
						<h3>Order summary</h3>
						<div class="restaurant-card checkout-summary-card">
							<div class="meta-list checkout-summary-meta">
								<div><dt>Subtotal</dt><dd id="subtotal">$0.00</dd></div>
								<div><dt>Base delivery fee</dt><dd id="deliveryFee">$0.00</dd></div>
								<div id="extraDeliveryRow"><dt>Extra multi-restaurant fee</dt><dd id="extraDeliveryFee">$0.00</dd></div>
								<div class="checkout-total-row"><dt>Total</dt><dd id="total">$0.00</dd></div>
							</div>
							<p id="restaurantMixNote" class="checkout-fee-note"></p>
							<div class="checkout-summary-actions">
								<button id="placeOrderBtn" class="refresh-button" type="button">Place order</button>
								<a href="index.html" class="checkout-back-link">Back to restaurants</a>
							</div>
							<div id="checkoutMessage" class="status-message"></div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</main>

	<script src="features/place-order.js"></script>
	<script src="features/cart-overlay.js"></script>
</body>
</html>
